name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: ¿Que villano envia el mensaje?
        required: true
        type: choice
        options: 
          - Lex Luthor
          - Magneto
          - Joker
          - Brainiac

      mensaje:
        description: Mensaje para el consejo
        required: true        
        default: 'La mision fue un exito'

      prioridad:
        description: Nivel de prioridad
        required: true
        type: choice
        options: 
          - Normal
          - Alta
          - Crítica
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: "Instalar el transmisor"
        run: sudo apt-get install -y cowsay
      - name: Imprimir inputs
        run: |
          echo "============================="
          echo "          Transmision        "
          echo "============================="
          echo ""
          echo "Villano: ${{inputs.villano}}"
          echo "Nivel: ${{inputs.prioridad}}"
          echo "========== Mensaje =========="
          cowsay -f eyes "${{inputs.mensaje}}"
          echo ""
