name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: ¿Que villano envia el mensaje?
        required: true
        type: choice
        options: 
          - Lex Luthor
          - Magneto
          - Joker
          - Brainiac

      mensaje:
        description: Mensaje para el consejo
        required: true        
        default: 'La mision fue un exito'

      prioridad:
        description: Nivel de prioridad
        required: true
        type: choice
        options: 
          - Normal
          - Alta
          - Crítica
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo ""
          echo "Villano: ${{inputs.villano}}"
          echo "Nivel: ${{inputs.nivel}}"
          echo "Mensaje: ${{inputs.mensaje}}"
