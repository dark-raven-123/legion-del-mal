name: Control de calidad
on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs: 
  revision-de-calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Acceder a los planes
        uses: actions/checkout@v4
      
      - name: Revisa los cambios
        run: |
          ls -al
          ls -al scripts
          chmod +x scripts/validar-planes.sh
          ./scripts/validar-planes.sh


    